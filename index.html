<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nisa İçin Özel Bir Davet ✨</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti for celebration effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts for romantic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .romantic-font {
            font-family: 'Playfair Display', serif;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .floating {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }
        .glow-bg {
            animation: pulse-slow 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-rose-50 via-pink-50 to-orange-50 min-h-screen flex items-center justify-center p-4 overflow-x-hidden relative">

    <!-- Background Ambient Glows -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-rose-200 rounded-full mix-blend-multiply filter blur-3xl glow-bg pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-pink-200 rounded-full mix-blend-multiply filter blur-3xl glow-bg pointer-events-none" style="animation-delay: 2s;"></div>

    <!-- Main Card Container -->
    <div id="cardContainer" class="relative z-10 max-w-lg w-full bg-white/80 backdrop-blur-xl border border-rose-100 shadow-2xl rounded-3xl p-8 sm:p-10 text-center transition-all duration-500 transform hover:shadow-rose-100/50">
        
        <!-- Floating Heart Icon -->
        <div class="inline-flex items-center justify-center w-16 h-16 bg-rose-100 text-rose-500 rounded-full mb-6 floating shadow-inner">
            <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>

        <!-- Header -->
        <span class="inline-block px-4 py-1.5 bg-rose-50 text-rose-600 font-medium text-xs tracking-widest uppercase rounded-full mb-3 border border-rose-100">Özel Bir Davet</span>
        <h1 class="romantic-font text-3xl sm:text-4xl font-semibold text-gray-800 mb-4">Sevgili Nisa,</h1>
        
        <!-- Invitation Body -->
        <p class="text-gray-600 text-base sm:text-lg leading-relaxed mb-8">
            mc de yemek yiyelimi senin icin wep sitesi yapdim be boyle erkek nerde bulacan😁👍🤣
        </p>

        <!-- Event Details Badge -->
        <div class="bg-rose-50/60 border border-rose-100/80 rounded-2xl p-4 mb-8 text-left space-y-2">
            <div class="flex items-center space-x-3 text-gray-700 text-sm">
                <span class="text-rose-500 font-semibold">📍 Mekan:</span>
                <span>Sizin İçin En Güzel Yer</span>
            </div>
            <div class="flex items-center space-x-3 text-gray-700 text-sm">
                <span class="text-rose-500 font-semibold">✨ Plan:</span>
                <span>yemek & Keyifli Sohbet</span>
            </div>
        </div>

        <!-- Interactive Buttons Area -->
        <div id="buttonArea" class="relative flex flex-col sm:flex-row items-center justify-center gap-4 h-28 sm:h-20">
            <!-- Yes Button -->
            <button id="yesBtn" onclick="handleYesClick()" class="w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-medium rounded-2xl shadow-lg shadow-rose-500/30 transition-all duration-300 transform hover:scale-105 active:scale-95">
                Kabul Ediyorum ❤️
            </button>
            
            <!-- No Button (Escaping) -->
            <button id="noBtn" onmouseover="moveNoButton()" onclick="handleNoClick()" class="w-full sm:w-auto px-8 py-4 bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium rounded-2xl transition-all duration-200">
                Maalesef / Düşünmem Lazım
            </button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let noClickCount = 0;
        const noMessages = [
            "Maalesef / Düşünmem Lazım",
            "Emin misin? 🥺",
            "Lütfen evet de! 🌸",
            "Bir daha düşün bence :)",
            "Bu buton geçersiz! (Evet'e basmalısın)",
            "Kaçamazsın Nisa! 💕"
        ];

        // Function to make the "No" button move away on mouse hover or click attempts
        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const cardContainer = document.getElementById('cardContainer');
            
            // Random movement inside safe boundaries
            const randomX = (Math.random() - 0.5) * 200;
            const randomY = (Math.random() - 0.5) * 100;
            
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
            
            // Cycle through playful messages
            noClickCount = (noClickCount + 1) % noMessages.length;
            noBtn.innerText = noMessages[noClickCount];
        }

        function handleNoClick() {
            moveNoButton();
        }

        // Function triggered when "Yes" button is clicked
        function handleYesClick() {
            // Trigger celebration confetti
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#ff4d6d', '#ff758c', '#ffb3c1', '#ffffff']
            });

            // Replace card content with a heartwarming success message
            const cardContainer = document.getElementById('cardContainer');
            cardContainer.innerHTML = `
                <div class="py-6">
                    <div class="inline-flex items-center justify-center w-20 h-20 bg-rose-100 text-rose-500 rounded-full mb-6 floating shadow-inner">
                        <svg class="w-10 h-10 fill-current animate-bounce" viewBox="0 0 24 24">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </div>
                    <span class="inline-block px-4 py-1.5 bg-rose-50 text-rose-600 font-medium text-xs tracking-widest uppercase rounded-full mb-3 border border-rose-100">Harika Haber!</span>
                    <h1 class="romantic-font text-3xl sm:text-4xl font-semibold text-gray-800 mb-4">Çok Sevindim, Nisa! 🥰</h1>
                    <p class="text-gray-600 text-base sm:text-lg leading-relaxed mb-6">
                        Bu harika akşamı seninle geçirecek olmak için sabırsızlanıyorum. Detayları ve saati en kısa sürede planlayacağız. Harika bir akşam bizi bekliyor! ✨
                    </p>
                    <div class="p-4 bg-rose-50/80 rounded-2xl border border-rose-100 text-rose-700 font-medium text-sm">
                        sagolasin artik benimsin hahahahahahah
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
